<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lab_2_react — Дем'янова Єлизавета</title>
  </head>
  <body>

    <div id="root"></div>


    <div id="contactModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="closeModalBtn" class="close-btn">&times;</button>
        <h3>Форма зворотного зв'язку</h3>
        <p>Будь ласка, заповніть форму для зв'язку зі мною.</p>
        
  
        <form id="feedbackForm" action="https://formspree.io/f/xqaejvqw" method="POST">
          <div class="form-group">
            <label for="name">Ім’я:</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="phone">Номер телефону:</label>
            <input type="tel" id="phone" name="phone" required />
          </div>
          <div class="form-group">
            <label for="message">Повідомлення:</label>
            <textarea id="message" name="message" rows="3" required></textarea>
          </div>
          <button type="submit">Надіслати</button>
        </form>
      </div>
    </div>


    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
